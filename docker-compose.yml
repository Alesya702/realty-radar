# Local development infrastructure.
#   docker compose up -d postgres                  # database only (typical: app runs via `go run`)
#   docker compose --profile app up -d --build     # database + application container
#   docker compose --profile app run --rm app migrate up

services:
  postgres:
    # PostGIS image: the extension is available for the future Location module,
    # but it is not enabled by any migration yet (see docs/decisions/0003-data-storage.md).
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: realtyradar
      POSTGRES_PASSWORD: realtyradar
      POSTGRES_DB: realtyradar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realtyradar -d realtyradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      RR_ENV: local
      RR_HTTP_ADDR: ":8080"
      RR_DATABASE_URL: postgres://realtyradar:realtyradar@postgres:5432/realtyradar?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
